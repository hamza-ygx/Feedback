<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Förslag C · Blocken — Revisionskonsulterna J Hägglund</title>
<meta name="theme-color" content="#F6F5F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Archivo:wght@700;800&display=swap">
<style>
/* =========================================================
   Förslag C · Blocken
   Revisionskonsulterna J Hägglund AB

   Logotypens byggsten som betygsskala: ett till fem röda
   block per svar. Inga symboler att tolka, störst tryckytor,
   högst kontrast.

   Skriver inte till databasen: det här är ett designförslag.
   ========================================================= */

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}

body{
  font-family:"Instrument Sans",Arial,sans-serif;
  background:#F6F5F3;
  color:#000000;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
  overflow:hidden;
  text-align:center;
}

/* ---------- Logotypen ---------- */

.lockup{
  position:fixed;
  top:0;left:0;right:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px 16px 0;
}
.lockup .block{
  width:34px;height:34px;
  width:min(4.6vmin,42px);height:min(4.6vmin,42px);
  margin-right:12px;
  flex:0 0 auto;
}
.lockup .block i{display:block;height:50%;}
.lockup .block i:first-child{background:#E52B38;}
.lockup .block i:last-child{background:#000000;}
.lockup .txt{text-align:left;line-height:1.12;}
.lockup .txt b{display:block;font-size:15px;font-size:min(2.4vmin,21px);font-weight:600;letter-spacing:-.01em;}
.lockup .txt span{display:block;font-size:13px;font-size:min(2.1vmin,18px);font-weight:700;}

/* ---------- Vyer ---------- */

.vy{
  position:fixed;
  top:84px;left:0;right:0;bottom:72px;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:0 18px;
}
.vy.pa{display:flex;}

h1{
  margin:0 0 18px;
  font-family:"Archivo",Arial,sans-serif;
  font-weight:800;
  font-size:32px; /* = clampat resultat vid plattans 1280×800 */
  font-size:clamp(19px,4vmin,36px);
  letter-spacing:-.03em;
  line-height:1.1;
}
.staplar{
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:640px;
  flex:1;
  max-height:520px;
}
.stapel{
  flex:1;
  margin-bottom:8px;
  border:2px solid #D9D7D2;
  border-radius:9px;
  background:#FFFFFF;
  font-family:inherit;
  cursor:pointer;
  display:flex;
  align-items:center;
  padding:0 18px;
  min-height:52px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
  transition:background .14s ease,border-color .14s ease,
             transform .14s ease,box-shadow .14s ease;
}
.stapel:last-child{margin-bottom:0;}
@media (hover:hover){
  .stapel:hover{border-color:#c2c0bb;box-shadow:0 2px 6px rgba(0,0,0,.08);}
}
.stapel:focus-visible{outline:3px solid #E52B38;outline-offset:2px;}
.stapel:active{background:#E52B38;border-color:#E52B38;transform:scale(.988);}
.stapel:active .ord{color:#FFFFFF;}
.stapel:active .kub i{background:#FFFFFF;border-color:#FFFFFF;}
.stapel:active .kub i.tom{background:none;border-color:rgba(255,255,255,.55);}
.kub{display:flex;flex:0 0 auto;}
.kub i{
  display:block;
  width:15px;height:15px;
  width:min(1.9vmin,17px);height:min(1.9vmin,17px);
  margin-right:5px;
  background:#E52B38;
  border:2px solid #E52B38;
  transition:background .14s ease,border-color .14s ease;
}
.kub i.tom{background:none;border-color:#D9D7D2;}
.ord{
  flex:1;
  text-align:center;
  font-family:"Archivo",Arial,sans-serif;
  font-weight:700;
  font-size:19px;
  font-size:clamp(14px,2.4vmin,22px);
  letter-spacing:-.01em;
  color:#000000;
  padding-right:112px;
  padding-right:calc(5 * (min(1.9vmin,17px) + 5px) + 2px);
  transition:color .14s ease;
}

.tack .ruta{
  width:76px;height:76px;
  background:#E52B38;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;
}
.tack .ruta svg{width:38px;height:38px;}
.tack h2{
  font-family:"Archivo",Arial,sans-serif;
  font-weight:800;
  font-size:40px;
  letter-spacing:-.03em;
  margin:0 0 8px;
}
.tack p{margin:0;font-size:15px;color:#505050;}

/* ---------- Sidfot ---------- */

.sidfot{position:fixed;bottom:0;left:0;right:0;padding:0 16px 16px;}
.sidfot .tagline{margin:0 0 3px;font-size:13px;font-size:min(2vmin,17px);font-style:italic;color:#505050;}
.sidfot .anonym{margin:0;font-size:10px;font-size:min(1.5vmin,13px);letter-spacing:.08em;text-transform:uppercase;color:#9C9A95;}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div class="lockup">
  <span class="block" aria-hidden="true"><i></i><i></i></span>
  <span class="txt"><b>Revisionskonsulterna</b><span>J Hägglund AB</span></span>
</div>

<div class="vy pa" data-vy="fraga">
  <h1>Vad tycker du om ditt besök?</h1>
  <div class="staplar" id="rad" role="group" aria-label="Betygsätt ditt besök"></div>
</div>

<div class="vy tack" data-vy="tack" aria-live="polite">
  <div class="ruta">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M26,52 L43,69 L74,34" fill="none" stroke="#FFFFFF"
            stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>
  <h2>Tack!</h2>
  <p>Ditt svar är registrerat.</p>
</div>

<div class="sidfot">
  <p class="tagline">”Engagemanget gör skillnaden”</p>
  <p class="anonym">Svaren är anonyma</p>
</div>

<script>
(function(){
  "use strict";

  var TACK_MS = 2600;
  var ORD = ["Mycket dåligt","Dåligt","Okej","Bra","Mycket bra"];

  var rad = document.getElementById("rad");
  for (var m = 0; m < 5; m++){
    (function(m){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "stapel";
      b.setAttribute("aria-label", ORD[m] + " — " + (m + 1) + " av 5");
      var kub = '<span class="kub" aria-hidden="true">';
      for (var q = 0; q < 5; q++){
        kub += '<i class="' + (q <= m ? "" : "tom") + '"></i>';
      }
      kub += '</span>';
      b.innerHTML = kub + '<span class="ord">' + ORD[m] + '</span>';
      b.onclick = svara;
      rad.appendChild(b);
    })(m);
  }

  var last = false, timer = null;
  var vyer = document.querySelectorAll(".vy");

  function byt(vilken){
    for (var i = 0; i < vyer.length; i++){
      var ar = vyer[i].getAttribute("data-vy") === vilken;
      vyer[i].className = "vy" + (ar ? " pa" : "") +
        (vyer[i].getAttribute("data-vy") === "tack" ? " tack" : "");
    }
  }

  function svara(){
    if (last) return;
    last = true;
    byt("tack");
    clearTimeout(timer);
    timer = setTimeout(function(){ byt("fraga"); last = false; }, TACK_MS);
  }

  document.oncontextmenu = function(e){ e.preventDefault(); };
})();
</script>
</body>
</html>
